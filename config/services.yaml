# config/services.yaml

parameters:

    cours_fichiers_directory: '%kernel.project_dir%/public/uploads/cours_fichiers'

    cloudinary_cloud_name: '%env(CLOUDINARY_CLOUD_NAME)%'
    cloudinary_api_key: '%env(CLOUDINARY_API_KEY)%'
    cloudinary_api_secret: '%env(CLOUDINARY_API_SECRET)%'
    cloudinary_cours_folder: '%env(default:cloudinary_cours_folder_default:CLOUDINARY_COURS_FOLDER)%'
    cloudinary_cours_folder_default: 'gestion-cours/cours'

    ollama_base_url: '%env(default:ollama_base_url_default:OLLAMA_BASE_URL)%'
    ollama_base_url_default: 'http://localhost:11434'
    ollama_model: '%env(default:ollama_model_default:OLLAMA_MODEL)%'
    ollama_model_default: 'llama3.1:8b'

    ollama_timeout: '%env(int:default:ollama_timeout_default:OLLAMA_TIMEOUT)%'
    ollama_timeout_default: 600



services:

    # default configuration for services in *this* file

    _defaults:

        autowire: true      # Automatically injects dependencies in your services.

        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.



    # makes classes in src/ available to be used as services

    # this creates a service per class whose id is the fully-qualified class name

    App\:

        resource: '../src/'

        exclude:

            - '../src/DependencyInjection/'

            - '../src/Entity/'

            - '../src/Kernel.php'



    # add more service definitions when explicit configuration is needed

    # please note that last definitions always *replace* previous ones



    App\Service\FileUploader:

        arguments:

            $targetDirectory: '%cours_fichiers_directory%'

    App\Service\CloudinaryUploader:
        arguments:
            $cloudName: '%cloudinary_cloud_name%'
            $apiKey: '%cloudinary_api_key%'
            $apiSecret: '%cloudinary_api_secret%'
            $folder: '%cloudinary_cours_folder%'

    App\Service\OpenAiSummaryService:
        arguments:
            $ollamaBaseUrl: '%ollama_base_url%'
            $ollamaModel: '%ollama_model%'
            $ollamaTimeoutSeconds: '%ollama_timeout%'

